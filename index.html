  <!-- =====================================================
       CLERK INITIALIZATION
       ===================================================== -->

  <script>

    window.__novexClerkReady = false;

    window.addEventListener("load", async function () {

      try {

        let attempts = 0;

        while (
          (
            typeof window.Clerk === "undefined" ||
            typeof window.__internal_ClerkUICtor === "undefined"
          ) &&
          attempts < 150
        ) {

          await new Promise(function(resolve) {
            setTimeout(resolve, 100);
          });

          attempts++;

        }


        if (typeof window.Clerk === "undefined") {

          console.error(
            "NOVEX: Clerk JS load nahi hua."
          );

          return;

        }


        if (
          typeof window.__internal_ClerkUICtor ===
          "undefined"
        ) {

          console.error(
            "NOVEX: Clerk UI bundle load nahi hua."
          );

          return;

        }


        await window.Clerk.load({

          ui: {
            ClerkUI:
              window.__internal_ClerkUICtor
          },

          signInForceRedirectUrl:
            window.location.href,

          signUpForceRedirectUrl:
            window.location.href

        });


        console.log(
          "NOVEX: Clerk + UI successfully loaded."
        );


        window.__novexClerkReady = true;


        window.dispatchEvent(
          new CustomEvent(
            "novex-clerk-ready"
          )
        );


      } catch (error) {

        console.error(
          "NOVEX CLERK LOAD ERROR:",
          error
        );

      }

    });

  </script>

  <!-- =====================================================
       FILE UI HELPER
       ===================================================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const fileInput =
          document.getElementById("fileInput");

        const selectedFile =
          document.getElementById("selectedFile");

        const selectedFileName =
          document.getElementById(
            "selectedFileName"
          );

        const removeSelectedFile =
          document.getElementById(
            "removeSelectedFile"
          );


        if (!fileInput) {
          return;
        }


        fileInput.addEventListener(
          "change",
          function () {

            const file =
              this.files && this.files[0];

            if (!file) {
              return;
            }


            selectedFileName.textContent =
              file.name;


            selectedFile.classList.remove(
              "hidden"
            );

          }
        );


        if (removeSelectedFile) {

          removeSelectedFile.addEventListener(
            "click",
            function () {

              fileInput.value = "";

              selectedFile.classList.add(
                "hidden"
              );

              selectedFileName.textContent =
                "File";

            }
          );

        }

      }
    );

  </script>
