  <!-- =====================================================
       CLERK UI INITIALIZATION
       ===================================================== -->

  <script>
    window.__novexClerkReady = false;

    window.addEventListener("load", async function () {

      try {

        let attempts = 0;

        /*
          Wait for both Clerk JS and Clerk UI bundle.
        */

        while (
          (
            typeof window.Clerk === "undefined" ||
            typeof window.__internal_ClerkUICtor === "undefined"
          ) &&
          attempts < 150
        ) {

          await new Promise(
            resolve => setTimeout(resolve, 100)
          );

          attempts++;
        }


        /*
          Clerk JS missing
        */

        if (typeof window.Clerk === "undefined") {

          console.error(
            "NOVEX: Clerk JS load nahi hua."
          );

          return;
        }


        /*
          Clerk UI missing
        */

        if (
          typeof window.__internal_ClerkUICtor === "undefined"
        ) {

          console.error(
            "NOVEX: Clerk UI bundle load nahi hua."
          );

          return;
        }


        /*
          IMPORTANT:
          Load Clerk WITH UI components.
        */

        await window.Clerk.load({

          ui: {
            ClerkUI:
              window.__internal_ClerkUICtor
          },

          signInForceRedirectUrl:
            window.location.href,

          signUpForceRedirectUrl:
            window.location.href

        });


        console.log(
          "NOVEX: Clerk + UI successfully loaded."
        );


        /*
          Tell script.js that Clerk is ready.
        */

        window.__novexClerkReady = true;


        /*
          Also dispatch an event in case script.js
          is already waiting for it.
        */

        window.dispatchEvent(
          new CustomEvent(
            "novex-clerk-ready"
          )
        );


      } catch (error) {

        console.error(
          "NOVEX CLERK LOAD ERROR:",
          error
        );

      }

    });
  </script>
